<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - H A S Royal Cool Service</title>
  <link rel="stylesheet" href="https
  ://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


  <style>
    :root {
      --primary: rgb(26, 157, 26);
    }

    body {
      background-color: #f8fff8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .thankyou-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .thankyou-logo {
      max-width: 120px;
      margin-bottom: 20px;
    }

    .thankyou-card {
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    .thankyou-title {
      color: var(--primary);
      font-size: 2rem;
      font-weight: bold;
    }

    .thankyou-text {
      font-size: 1.1rem;
      margin: 20px 0;
      color: #444;
    }

    .btn-home {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 25px;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    .btn-home:hover {
      background-color: rgb(20, 125, 20);
    }
    .logo{
  width: 70px !important;
  height: 70px !important;
  border-radius: 50%;
  border: 2px solid rgb(26, 157, 26);

}
  </style>
</head>

<body>
 
  <div class="thankyou-container">
    <div class="thankyou-card">
      <!-- Replace the src below with your actual logo -->
      <img src="images/hero3-furniture.jpeg.jpg " alt="Furniture" class="thankyou-logo logo" />

      <h1 class="thankyou-title">Thank You!</h1>
      <p class="thankyou-text">
        Your request has been successfully submitted. <br />
        Our team will contact you shortly for confirmation.
      </p>

      <a href="landing.html" class="btn btn-home">
        Back to Home
      </a>
    </div>
  </div>


</body>

</html>
